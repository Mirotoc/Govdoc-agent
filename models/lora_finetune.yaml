model_name_or_path: ./models/base/Qwen3.5-4B
trust_remote_code: false

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
quantization_bit: 4

dataset: govdoc_labels
template: qwen
cutoff_len: 4096
val_size: 0.2

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
bf16: true

output_dir: ./adapters/govdoc-lora-v0.1
logging_steps: 10
save_strategy: epoch
report_to: none
